name: Ryder - Windows + Tailscale + RDP (v3)

# ---------------------------------------------------------------------------------------------
# Secrets used by this workflow (Settings > Secrets and variables > Actions):
#   TAILSCALE_AUTHKEY        required   (Ephemeral + tagged key)
#   RDP_PASSWORD             recommended (12+ chars). Without it a random one is served on http://<tailscale-ip>:8080
#   FILES_PAT                for the private files repo (fine-grained token, repo Giraium/Ryder-files, Contents: Read and write)
#   DISCORD_NOTIFY_WEBHOOK   webhook of the ryder-notify channel
#
# v3 adds:
#   - Files: a private repo (Giraium/Ryder-files) is the shared folder.
#       drop/ folder in the repo + assets of the release named "drop"  -> C:\Drop  -> copied into Downloads at RDP logon
#       C:\Work    is backed up every 10 min to release "work" (work.zip) and restored in the next session
#       C:\Outbox  new/changed files are uploaded every 2 min to release "outbox"
#   - Auto-renew: ~30 min before GitHub's 6-hour job limit a fresh session is started automatically.
#   - Discord notifications (starting / ready / warnings / ended) and optional remote commands from the bot.
#   - No idle shutdown of any kind.
# ---------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Tool preset (installed through Chocolatey)"
        type: choice
        options:
          - minimal
          - dev
          - security-lab
        default: minimal
      install_vscode:
        description: "Install Visual Studio Code"
        type: boolean
        default: true
      install_discord:
        description: "Install Discord and open it (with Brave) when you log in over RDP"
        type: boolean
        default: true
      extra_tools:
        description: "Extra Chocolatey packages, comma separated (example: nmap,7zip). Empty = none"
        type: string
        default: ""
      auto_renew:
        description: "Start a fresh session automatically before the 6-hour limit"
        type: boolean
        default: true
      max_renewals:
        description: "Maximum automatic renewals in a row (0 = unlimited)"
        type: string
        default: "8"
      remote_exec:
        description: "Allow the Discord bot to run commands in this session (/exec)"
        type: boolean
        default: false
      renew_count:
        description: "(internal) how many renewals happened so far"
        type: string
        default: "0"

permissions: {}

env:
  FILES_REPO: Giraium/Ryder-files

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 355
    permissions:
      actions: write   # lets the session start its own replacement (gh workflow run)

    steps:
      - name: Configure Core RDP Settings
        run: |
          $ErrorActionPreference = 'Stop'

          # Remember when the job started (used by the watchdog to count the remaining time)
          "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          # Enable Remote Desktop with NLA ON
          $ts  = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts  -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcp -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $tcp -Name 'SecurityLayer'      -Value 2 -Force

          # Close any built-in RDP rules, then allow 3389 ONLY from Tailscale addresses
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # RDP over UDP = noticeably lower latency (still Tailscale-only)
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # Windows Audio is off by default on the runner: enable it so sound works over RDP
          foreach ($svc in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name $svc -ErrorAction SilentlyContinue
          }

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $password = $env:RDP_PASSWORD_SECRET
          $serve = 'false'

          if ([string]::IsNullOrWhiteSpace($password)) {
            # No secret provided: generate a random password (never printed to the log)
            $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'.ToCharArray()
            $bytes = New-Object byte[] 20
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = (($bytes | ForEach-Object { $chars[$_ % $chars.Length] }) -join '') + '-Aa1'
            $serve = 'true'
          }
          elseif ($password.Length -lt 12) {
            Write-Error "Secret RDP_PASSWORD is shorter than 12 characters."
            exit 1
          }

          # Mask it so it can never appear in the logs by accident
          Write-Host "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
          # Remove the next line if you don't need admin rights inside the session
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP')) {
            Write-Error "User creation failed"
            exit 1
          }

          if ($serve -eq 'true') {
            # Password page: reachable ONLY from Tailscale addresses
            Remove-NetFirewallRule -DisplayName 'PW-Tailscale' -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName 'PW-Tailscale' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 `
              -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null
          }

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          "SERVE_PASSWORD=$serve"  >> $env:GITHUB_ENV
          Write-Host "RDP user is ready."

      - name: Tune display, quality and speed
        run: |
          # Best-effort tuning: a failure here never stops the workflow
          $ErrorActionPreference = 'Continue'

          function Set-Reg($path, $name, $value, $type) {
            if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
            Set-ItemProperty -Path $path -Name $name -Value $value -Type $type -Force
          }

          # 1) High performance power plan (no CPU throttling)
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c | Out-Null

          # 2) Time zone: Baghdad
          Set-TimeZone -Id 'Arabian Standard Time' -ErrorAction SilentlyContinue

          # 3) Keep RDP sessions alive: no idle/disconnect limits, keep-alive packets
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          foreach ($name in 'MaxIdleTime', 'MaxDisconnectionTime', 'MaxConnectionTime') {
            Set-Reg $pol $name 0 'DWord'
          }
          Set-Reg $pol 'KeepAliveEnable' 1 'DWord'
          Set-Reg $pol 'KeepAliveInterval' 1 'DWord'

          # 3b) Frame rate: RDP's maximum is 60 FPS (default is 30). 15 ms per frame = 60 FPS.
          Set-Reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' 'DWMFRAMEINTERVAL' 15 'DWord'

          # 4) Stop background services that waste CPU and disk
          foreach ($svc in 'WSearch', 'SysMain') {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # 5) Defaults for the RDP user (copied from the Default profile at first logon):
          #    no animations/transparency/wallpaper/screensaver, but crisp ClearType text
          $hive = 'C:\Users\Default\NTUSER.DAT'
          if (Test-Path $hive) {
            reg load HKU\DefUser $hive | Out-Null
            try {
              $k = 'Registry::HKEY_USERS\DefUser'
              $desk = "$k\Control Panel\Desktop"
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" 'VisualFXSetting' 2 'DWord'
              Set-Reg $desk 'UserPreferencesMask' ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) 'Binary'
              Set-Reg $desk 'MenuShowDelay' '0' 'String'
              Set-Reg $desk 'FontSmoothing' '2' 'String'
              Set-Reg $desk 'FontSmoothingType' 2 'DWord'
              Set-Reg $desk 'ScreenSaveActive' '0' 'String'
              Set-Reg $desk 'Wallpaper' '' 'String'
              Set-Reg "$desk\WindowMetrics" 'MinAnimate' '0' 'String'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" 'EnableTransparency' 0 'DWord'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" 'TaskbarAnimations' 0 'DWord'
              Write-Host "Display tuning applied to the default profile."
            }
            catch {
              Write-Host "Display tuning skipped: $($_.Exception.Message)"
            }
            finally {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKU\DefUser | Out-Null
            }
          }

      - name: Write helper library
        run: |
          New-Item -ItemType Directory -Path 'C:\ProgramData\ryder' -Force | Out-Null
          $lib = @'
          # Ryder helper library - written to C:\ProgramData\ryder\lib.ps1 and dot-sourced by later steps
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'

          # ---------- Discord notifications (channel: ryder-notify) ----------
          function Send-Notify {
            param(
              [string]$Title,
              [string]$Description = '',
              [string]$Kind = 'info',
              [hashtable[]]$Fields = @()
            )
            if ([string]::IsNullOrWhiteSpace($env:DISCORD_NOTIFY_WEBHOOK)) { return }
            $colors = @{ ok = 3066993; warn = 15844367; err = 15158332; info = 3447003 }
            $embed = @{
              title       = $Title
              description = $Description
              color       = $colors[$Kind]
              timestamp   = (Get-Date).ToUniversalTime().ToString('o')
              footer      = @{ text = 'Ryder' }
            }
            if ($Fields.Count -gt 0) {
              $embed.fields = @($Fields | ForEach-Object {
                @{ name = [string]$_.name; value = [string]$_.value; inline = [bool]$_.inline }
              })
            }
            $payload = @{ username = 'Ryder'; allowed_mentions = @{ parse = @() }; embeds = @($embed) } | ConvertTo-Json -Depth 6 -Compress
            try {
              Invoke-RestMethod -Uri $env:DISCORD_NOTIFY_WEBHOOK -Method Post `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            }
            catch { Write-Host "[notify] failed: $($_.Exception.Message)" }
          }

          # ---------- GitHub CLI against the private files repo ----------
          function Invoke-GhFiles {
            # Uses FILES_PAT only for this one call, then puts the previous token back
            $old = $env:GH_TOKEN
            $env:GH_TOKEN = $env:FILES_PAT
            try { & gh @args 2>&1 }
            finally { $env:GH_TOKEN = $old }
          }

          function Initialize-Release([string]$Tag) {
            Invoke-GhFiles release view $Tag --repo $env:FILES_REPO *> $null
            if ($LASTEXITCODE -ne 0) {
              Invoke-GhFiles release create $Tag --repo $env:FILES_REPO --title $Tag --notes 'managed by Ryder' | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "cannot create release '$Tag' (does the files repo have at least one commit, and does FILES_PAT have Contents: write?)"
              }
            }
          }

          # ---------- Restore: Drop folder + last Work backup ----------
          function Restore-State {
            New-Item -ItemType Directory -Path 'C:\Drop', 'C:\Work', 'C:\Outbox' -Force | Out-Null
            $info = [ordered]@{ drop_repo = 0; drop_release = 0; work = 'none' }

            # 1) files placed in the "drop" folder of the files repo
            try {
              $tmp = Join-Path $env:TEMP 'files-clone'
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
              $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:FILES_PAT)"))
              Write-Host "::add-mask::$b64"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64" clone --depth 1 --quiet "https://github.com/$($env:FILES_REPO).git" $tmp 2>&1 | Out-Null
              if (Test-Path "$tmp\drop") {
                Copy-Item -Path "$tmp\drop\*" -Destination 'C:\Drop' -Recurse -Force
                $info.drop_repo = @(Get-ChildItem 'C:\Drop' -Recurse -File).Count
              }
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            }
            catch { Write-Host "[restore] drop folder failed: $($_.Exception.Message)" }

            # 2) assets of the release named "drop" (use this for big files, up to 2 GB each)
            try {
              Invoke-GhFiles release download drop --repo $env:FILES_REPO --dir 'C:\Drop' --clobber | Out-Null
              $info.drop_release = @(Get-ChildItem 'C:\Drop' -Recurse -File).Count
            }
            catch { Write-Host "[restore] drop release failed: $($_.Exception.Message)" }

            # 3) last backup of C:\Work
            try {
              $zipDir = Join-Path $env:TEMP 'work-restore'
              New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
              Invoke-GhFiles release download work --repo $env:FILES_REPO --pattern 'work.zip' --dir $zipDir --clobber | Out-Null
              if (Test-Path "$zipDir\work.zip") {
                tar.exe -xf "$zipDir\work.zip" -C 'C:\Work'
                $info.work = 'restored'
              }
            }
            catch { Write-Host "[restore] work failed: $($_.Exception.Message)" }

            return $info
          }

          # ---------- Backup: C:\Work -> release "work" (one work.zip, replaced each time) ----------
          function Backup-Work {
            if (-not (Test-Path 'C:\Work')) { return 'no Work folder' }
            $skip = '\\(node_modules|\.venv|__pycache__)\\'
            $files = @(Get-ChildItem 'C:\Work' -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch $skip })
            if ($files.Count -eq 0) { return 'Work is empty - nothing to back up' }

            $sum = ($files | Measure-Object -Property Length -Sum).Sum
            $newest = ($files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1).LastWriteTimeUtc.Ticks
            $sig = "$sum|$($files.Count)|$newest"
            if ($script:LastWorkSig -eq $sig) { return 'unchanged' }

            $zip = Join-Path $env:TEMP 'work.zip'
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            tar.exe -a -c -f $zip --exclude=node_modules --exclude=.venv --exclude=__pycache__ -C 'C:\Work' .
            if ($LASTEXITCODE -gt 1) { throw "tar failed (exit $LASTEXITCODE)" }

            $len = (Get-Item $zip).Length
            $mb = [math]::Round($len / 1MB, 1)
            if ($len -gt 1.9GB) { throw "work.zip is $mb MB - above the 2 GB release-asset limit; move big files out of C:\Work" }

            Initialize-Release 'work'
            Invoke-GhFiles release upload work $zip --repo $env:FILES_REPO --clobber | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'upload of work.zip failed' }
            $script:LastWorkSig = $sig
            return "uploaded ($mb MB)"
          }

          # ---------- Backup: C:\Outbox -> release "outbox" (every new/changed file) ----------
          function Backup-Outbox {
            if (-not (Test-Path 'C:\Outbox')) { return 'no Outbox folder' }
            if (-not $script:OutboxSeen) { $script:OutboxSeen = @{} }
            $pending = @()
            foreach ($f in Get-ChildItem 'C:\Outbox' -Recurse -File -ErrorAction SilentlyContinue) {
              $stamp = "$($f.Length)|$($f.LastWriteTimeUtc.Ticks)"
              if ($script:OutboxSeen[$f.FullName] -ne $stamp) { $pending += $f }
            }
            if ($pending.Count -eq 0) { return 'nothing new' }

            Initialize-Release 'outbox'
            $ok = 0
            foreach ($f in $pending) {
              if ($f.Length -gt 1.9GB) { Write-Host "[outbox] skipped (over 2 GB): $($f.Name)"; continue }
              Invoke-GhFiles release upload outbox $f.FullName --repo $env:FILES_REPO --clobber | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $script:OutboxSeen[$f.FullName] = "$($f.Length)|$($f.LastWriteTimeUtc.Ticks)"
                $ok++
              }
            }
            return "$ok file(s) uploaded"
          }
          '@
          Set-Content -Path 'C:\ProgramData\ryder\lib.ps1' -Value $lib -Encoding UTF8

      - name: Provision apps and dev environment
        env:
          PRESET: ${{ inputs.preset }}
          INSTALL_VSCODE: ${{ inputs.install_vscode }}
          INSTALL_DISCORD: ${{ inputs.install_discord }}
          EXTRA_TOOLS: ${{ inputs.extra_tools }}
        run: |
          # Everything here runs BEFORE Tailscale comes up, so the RDP user's first logon already
          # sees Brave as default browser, the shortcuts and the tools. Every section is best-effort:
          # one failure is printed in the log and never stops the session.
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Invoke-Section([string]$Name, [scriptblock]$Body) {
            Write-Host "::group::$Name"
            try { & $Body; Write-Host "[ok] $Name" }
            catch { Write-Host "[FAILED] $Name : $($_.Exception.Message)" }
            Write-Host "::endgroup::"
          }

          function Get-Signed([string]$Url, [string]$Out, [string]$Signer) {
            for ($i = 1; $i -le 3; $i++) {
              try { Invoke-WebRequest -Uri $Url -OutFile $Out -UseBasicParsing -MaximumRedirection 10; break }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds 3 }
            }
            $sig = Get-AuthenticodeSignature $Out
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch $Signer) {
              Remove-Item $Out -Force -ErrorAction SilentlyContinue
              throw "signature check failed (status=$($sig.Status)) for $Url"
            }
          }

          function New-Shortcut([string]$Path, [string]$Target, [string]$Arguments = '') {
            $w = New-Object -ComObject WScript.Shell
            $s = $w.CreateShortcut($Path)
            $s.TargetPath = $Target
            if ($Arguments) { $s.Arguments = $Arguments }
            $s.Save()
          }

          function Add-MachinePath([string]$Dir) {
            $cur = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            if (($cur -split ';') -notcontains $Dir) {
              [Environment]::SetEnvironmentVariable('Path', "$Dir;$cur", 'Machine')
            }
          }

          $desktop = 'C:\Users\Public\Desktop'
          New-Item -ItemType Directory -Path 'C:\Tools', 'C:\Work' -Force | Out-Null

          # ---- 1) Brave (machine-wide, official offline installer, signature checked) ----
          Invoke-Section 'Brave' {
            $f = Join-Path $env:TEMP 'BraveSetup.exe'
            try {
              Get-Signed 'https://github.com/brave/brave-browser/releases/latest/download/BraveBrowserStandaloneSetup.exe' $f 'Brave'
            }
            catch {
              Write-Host "Primary Brave source failed ($($_.Exception.Message)) - trying brave.com"
              Get-Signed 'https://laptop-updates.brave.com/latest/winx64' $f 'Brave'
            }
            $p = Start-Process -FilePath $f -ArgumentList '/silent', '/install' -Wait -PassThru
            Write-Host "Brave installer exit code: $($p.ExitCode)"
            Remove-Item $f -Force -ErrorAction SilentlyContinue
            $exe = "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe"
            if (-not (Test-Path $exe)) { throw "brave.exe not found after install" }
            New-Shortcut "$desktop\Brave.lnk" $exe
          }

          # ---- 2) Brave = default browser for every NEW user (the RDP user is created fresh) ----
          Invoke-Section 'Default browser' {
            $xmlPath = "$env:ProgramData\default-apps.xml"
            $xml = @(
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<DefaultAssociations>',
              '  <Association Identifier="http"  ProgId="BraveHTML" ApplicationName="Brave" />',
              '  <Association Identifier="https" ProgId="BraveHTML" ApplicationName="Brave" />',
              '  <Association Identifier=".htm"  ProgId="BraveHTML" ApplicationName="Brave" />',
              '  <Association Identifier=".html" ProgId="BraveHTML" ApplicationName="Brave" />',
              '</DefaultAssociations>'
            ) -join "`n"
            Set-Content -Path $xmlPath -Value $xml -Encoding UTF8
            dism.exe /Online /Import-DefaultAppAssociations:"$xmlPath" | Out-Null
            $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System'
            if (-not (Test-Path $pol)) { New-Item -Path $pol -Force | Out-Null }
            Set-ItemProperty -Path $pol -Name 'DefaultAssociationsConfiguration' -Value $xmlPath -Type String -Force
          }

          # ---- 3) Remove Edge (best effort) and stop it coming back ----
          Invoke-Section 'Remove Edge' {
            $base = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application"
            $setup = Get-ChildItem -Path $base -Filter 'setup.exe' -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\Installer\\setup\.exe$' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($setup) {
              $p = Start-Process -FilePath $setup.FullName -Wait -PassThru `
                -ArgumentList '--uninstall', '--system-level', '--verbose-logging', '--force-uninstall'
              Write-Host "Edge uninstall exit code: $($p.ExitCode)"
            } else {
              Write-Host "Edge installer not found (already removed?)"
            }
            $eu = 'HKLM:\SOFTWARE\Microsoft\EdgeUpdate'
            if (-not (Test-Path $eu)) { New-Item -Path $eu -Force | Out-Null }
            Set-ItemProperty -Path $eu -Name 'DoNotUpdateToEdgeWithChromium' -Value 1 -Type DWord -Force
            foreach ($svc in 'edgeupdate', 'edgeupdatem', 'MicrosoftEdgeElevationService') {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
            }
            Get-ScheduledTask -TaskName 'MicrosoftEdgeUpdate*' -ErrorAction SilentlyContinue |
              Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null
            Remove-Item "$desktop\Microsoft Edge.lnk" -Force -ErrorAction SilentlyContinue
            if (Test-Path "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe") {
              Write-Host "NOTE: Edge is still present (Windows may protect it). Brave is the default anyway."
            }
          }

          # ---- 4) Windows Terminal (portable build from Microsoft's GitHub release) ----
          Invoke-Section 'Windows Terminal' {
            $hdr = @{ 'User-Agent' = 'ryder-workflow'; 'Accept' = 'application/vnd.github+json' }
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/microsoft/terminal/releases/latest' -Headers $hdr
            $asset = $rel.assets | Where-Object { $_.name -match '^Microsoft\.WindowsTerminal_.+_x64\.zip$' } | Select-Object -First 1
            if (-not $asset) { throw "x64 zip asset not found in the latest release" }
            $zip = Join-Path $env:TEMP 'wt.zip'
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip -UseBasicParsing
            $dest = 'C:\Tools\WindowsTerminal'
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            $wt = Get-ChildItem -Path $dest -Recurse -Filter 'wt.exe' | Select-Object -First 1
            if (-not $wt) { throw "wt.exe not found after extraction" }
            $sig = Get-AuthenticodeSignature $wt.FullName
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Windows Terminal signature check failed (status=$($sig.Status))"
            }
            $root = $wt.DirectoryName
            # Portable mode: settings live next to the exe, default profile = PowerShell 7
            New-Item -ItemType File -Path (Join-Path $root '.portable') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $root 'settings') -Force | Out-Null
            $cfg = '{ "$schema": "https://aka.ms/terminal-profiles-schema", "defaultProfile": "{574e775e-4f2a-5b96-ac1e-a2962a402336}", "copyOnSelect": true }'
            Set-Content -Path (Join-Path $root 'settings\settings.json') -Value $cfg -Encoding UTF8
            Add-MachinePath $root
            New-Shortcut "$desktop\Terminal.lnk" $wt.FullName
          }

          # ---- 5) Visual Studio 2022 (already on the runner image) + optional VS Code ----
          Invoke-Section 'Visual Studio' {
            $vs = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\Common7\IDE\devenv.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $vs) { throw "devenv.exe not found on this image" }
            New-Shortcut "$desktop\Visual Studio 2022.lnk" $vs.FullName
          }

          if ($env:INSTALL_VSCODE -eq 'true') {
            Invoke-Section 'VS Code' {
              $f = Join-Path $env:TEMP 'vscode-setup.exe'
              Get-Signed 'https://update.code.visualstudio.com/latest/win32-x64/stable' $f 'Microsoft'
              $p = Start-Process -FilePath $f -Wait -PassThru -ArgumentList '/VERYSILENT', '/NORESTART', '/SUPPRESSMSGBOXES', '/MERGETASKS=!runcode,desktopicon,addtopath'
              Write-Host "VS Code installer exit code: $($p.ExitCode)"
              Remove-Item $f -Force -ErrorAction SilentlyContinue
            }
          }

          # ---- 5b) What happens when the RDP user logs in: Brave + Discord open, Drop files copied to Downloads ----
          Invoke-Section 'Startup apps (Brave + Discord + Drop folder)' {
            $startupAll = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp'
            New-Item -ItemType Directory -Path $startupAll, 'C:\ProgramData\ryder', 'C:\Drop', 'C:\Work', 'C:\Outbox' -Force | Out-Null

            # Handy desktop shortcuts to the three synced folders
            New-Shortcut "$desktop\Drop.lnk"   'C:\Drop'
            New-Shortcut "$desktop\Work.lnk"   'C:\Work'
            New-Shortcut "$desktop\Outbox.lnk" 'C:\Outbox'

            # Brave opens at logon
            $brave = "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe"
            if (Test-Path $brave) { New-Shortcut "$startupAll\Brave.lnk" $brave }
            else { Write-Host "Brave not found - not added to startup" }

            # Logon script, part 1: copy everything from C:\Drop into the user's Downloads folder
            $dropPs1 = @'
          $dl = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -ItemType Directory -Path $dl -Force | Out-Null
          if (Test-Path 'C:\Drop') { robocopy 'C:\Drop' $dl /E /XO /R:1 /W:1 /NFL /NDL /NJH /NJS /NP | Out-Null }
          '@

            # Logon script, part 2: Discord installs per user, so it is installed (once) and opened here
            $discordPs1 = ''
            if ($env:INSTALL_DISCORD -eq 'true') {
              $dl = "$env:ProgramData\DiscordSetup.exe"
              try { Get-Signed 'https://discord.com/api/download?platform=win' $dl 'Discord' }
              catch { Write-Host "Discord pre-download failed ($($_.Exception.Message)) - it will be downloaded at logon" }
              $discordPs1 = @'
          $ProgressPreference = 'SilentlyContinue'
          $update = Join-Path $env:LOCALAPPDATA 'Discord\Update.exe'
          if (-not (Test-Path $update)) {
            $setup = Join-Path $env:ProgramData 'DiscordSetup.exe'
            if (-not (Test-Path $setup)) {
              try { Invoke-WebRequest -Uri 'https://discord.com/api/download?platform=win' -OutFile $setup -UseBasicParsing } catch {}
            }
            if (Test-Path $setup) {
              $sig = Get-AuthenticodeSignature $setup
              if ($sig.Status -eq 'Valid' -and $sig.SignerCertificate.Subject -match 'Discord') {
                Start-Process -FilePath $setup -ArgumentList '-s' -Wait
              }
            }
          }
          for ($i = 0; $i -lt 60 -and -not (Test-Path $update); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $update) { Start-Process -FilePath $update -ArgumentList '--processStart', 'Discord.exe' }
          '@
            }

            Set-Content -Path 'C:\ProgramData\ryder\logon.ps1' -Value ($dropPs1 + "`r`n" + $discordPs1) -Encoding UTF8
            $cmd = '@echo off' + "`r`n" + 'powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "C:\ProgramData\ryder\logon.ps1"'
            Set-Content -Path "$startupAll\start-ryder.cmd" -Value $cmd -Encoding ASCII
          }

          # ---- 6) Languages / runtimes: use what the image already ships, make Java 21 the default ----
          Invoke-Section 'Dev environment' {
            foreach ($v in 25, 21, 17) {
              $jdk = [Environment]::GetEnvironmentVariable("JAVA_HOME_${v}_X64", 'Process')
              if ($jdk -and (Test-Path "$jdk\bin\java.exe")) {
                [Environment]::SetEnvironmentVariable('JAVA_HOME', $jdk, 'Machine')
                Add-MachinePath "$jdk\bin"
                Write-Host "JAVA_HOME -> $jdk"
                break
              }
            }
            $tools = @(
              @('python', '--version'), @('pip', '--version'), @('node', '--version'), @('npm', '--version'),
              @('go', 'version'), @('java', '-version'), @('dotnet', '--version'), @('rustc', '--version'),
              @('cargo', '--version'), @('php', '-v'), @('ruby', '--version'), @('git', '--version'),
              @('gh', '--version'), @('pwsh', '-v'), @('choco', '--version')
            )
            foreach ($t in $tools) {
              if (Get-Command $t[0] -ErrorAction SilentlyContinue) {
                $line = (& $t[0] $t[1] 2>&1 | Select-Object -First 1) | Out-String
                Write-Host ("{0,-8} {1}" -f $t[0], $line.Trim())
              } else {
                Write-Host ("{0,-8} NOT FOUND" -f $t[0])
              }
            }
          }

          # ---- 7) Preset + extra tools (Chocolatey). Edit the lists below to taste. ----
          # Only use security tools on systems you own or are explicitly authorised to test.
          $presets = @{
            'minimal'      = @()
            'dev'          = @('7zip', 'jq', 'ripgrep')
            'security-lab' = @('7zip', 'nmap', 'sysinternals', 'ghidra', 'trivy', 'gitleaks', 'zap', 'x64dbg.portable')
          }
          $wanted = @()
          if ($presets.ContainsKey($env:PRESET)) { $wanted += $presets[$env:PRESET] }
          if (-not [string]::IsNullOrWhiteSpace($env:EXTRA_TOOLS)) { $wanted += ($env:EXTRA_TOOLS -split '[,\s]+' | Where-Object { $_ }) }
          $wanted = @($wanted | Select-Object -Unique)

          if ($wanted.Count -gt 0) {
            Invoke-Section "Tools ($($wanted -join ', '))" {
              foreach ($pkg in $wanted) {
                if ($pkg -notmatch '^[a-z0-9][a-z0-9.\-]*$') { Write-Host "skipping invalid package name: $pkg"; continue }
                Write-Host "choco install $pkg"
                choco install $pkg -y --no-progress --limit-output
                Write-Host "exit code: $LASTEXITCODE"
              }
              if ($env:PRESET -eq 'security-lab') {
                Write-Host "pip: bandit, pip-audit"
                python -m pip install --quiet bandit pip-audit
              }
            }
          }

      - name: Restore files (Drop + Work)
        env:
          PRESET: ${{ inputs.preset }}
          RENEW_COUNT: ${{ inputs.renew_count }}
          FILES_PAT: ${{ secrets.FILES_PAT }}
          DISCORD_NOTIFY_WEBHOOK: ${{ secrets.DISCORD_NOTIFY_WEBHOOK }}
        run: |
          $ErrorActionPreference = 'Continue'
          . 'C:\ProgramData\ryder\lib.ps1'

          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $renewNote = ''
          $rc = 0; [void][int]::TryParse($env:RENEW_COUNT, [ref]$rc)
          if ($rc -gt 0) { $renewNote = "`nهذي جلسة مجدّدة تلقائياً (رقم $env:RENEW_COUNT)." }
          Send-Notify -Title '⏳ بدأ تجهيز الجلسة' -Kind info `
            -Description ("الإعداد: $env:PRESET. يأخذ التجهيز عادة بضع دقائق، وتجيك رسالة أخرى لما تصير جاهزة." + $renewNote) `
            -Fields @(@{ name = 'السجل'; value = $runUrl; inline = $false })

          if ([string]::IsNullOrWhiteSpace($env:FILES_PAT)) {
            Write-Host "FILES_PAT is not set - skipping file restore (folders are still created)."
            New-Item -ItemType Directory -Path 'C:\Drop', 'C:\Work', 'C:\Outbox' -Force | Out-Null
            exit 0
          }

          $info = Restore-State
          Write-Host ("Drop files: {0} | Work: {1}" -f $info.drop_release, $info.work)
          # Missing "drop"/"work" releases are expected on the first run and leave
          # $LASTEXITCODE = 1; Actions would turn that into a failed step. Reset it.
          $global:LASTEXITCODE = 0

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installerPath = "$env:TEMP\tailscale.msi"

          # Newest stable MSI for Windows (falls back to the "latest" alias)
          $ver = $null
          try { $ver = (Invoke-RestMethod -Uri 'https://pkgs.tailscale.com/stable/?mode=json&os=windows').Version } catch {}
          $tsUrl = if ($ver) { "https://pkgs.tailscale.com/stable/tailscale-setup-$ver-amd64.msi" }
                   else { 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' }
          Write-Host "Downloading $tsUrl"

          for ($i = 1; $i -le 3; $i++) {
            try { Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing; break }
            catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds 3 }
          }

          # Make sure the installer is really signed by Tailscale
          $sig = Get-AuthenticodeSignature $installerPath
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') {
            Write-Error "Tailscale installer signature check failed."
            exit 1
          }

          Start-Process msiexec.exe -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Never fall back to a manual login link: in a public repo the log is visible to everyone
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "Secret TAILSCALE_AUTHKEY is missing in this repository - stopping."
            exit 1
          }

          # Up to 3 attempts: a transient network hiccup should not kill the whole run
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            & $ts up --authkey=$env:TS_AUTHKEY --hostname=ryder `
              --unattended --accept-dns=false --accept-routes=false --timeout=60s
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "tailscale up failed (attempt $i)"; Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { Write-Error "tailscale up failed after 3 attempts"; exit 1 }

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

          Write-Host "--- Tailscale network check (UDP / nearest relay) ---"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" netcheck

      - name: Announce ready
        env:
          DISCORD_NOTIFY_WEBHOOK: ${{ secrets.DISCORD_NOTIFY_WEBHOOK }}
        run: |
          $ErrorActionPreference = 'Continue'
          . 'C:\ProgramData\ryder\lib.ps1'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $dns = $env:TAILSCALE_IP
          try {
            $self = (& $ts status --json | ConvertFrom-Json).Self
            if ($self.DNSName) { $dns = $self.DNSName.TrimEnd('.') }
          } catch {}

          if ($env:SERVE_PASSWORD -eq 'true') { $pw = "صفحة داخل Tailscale: http://$($env:TAILSCALE_IP):8080/" }
          else { $pw = 'هو سر RDP_PASSWORD عندك' }

          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          Send-Notify -Title '🟢 الجلسة جاهزة' -Kind ok `
            -Description 'تقدر تتصل الآن من Windows App.' `
            -Fields @(
              @{ name = 'الاسم';     value = $dns;             inline = $true },
              @{ name = 'العنوان';   value = $env:TAILSCALE_IP; inline = $true },
              @{ name = 'المستخدم';  value = 'RDP';            inline = $true },
              @{ name = 'الباسورد';  value = $pw;              inline = $false },
              @{ name = 'السجل';     value = $runUrl;          inline = $false }
            )
          Write-Host "Ready announcement sent."

      - name: Maintain Connection + Watchdog
        env:
          PRESET: ${{ inputs.preset }}
          INSTALL_VSCODE: ${{ inputs.install_vscode }}
          INSTALL_DISCORD: ${{ inputs.install_discord }}
          EXTRA_TOOLS: ${{ inputs.extra_tools }}
          AUTO_RENEW: ${{ inputs.auto_renew }}
          MAX_RENEWALS: ${{ inputs.max_renewals }}
          RENEW_COUNT: ${{ inputs.renew_count }}
          REMOTE_EXEC: ${{ inputs.remote_exec }}
          FILES_PAT: ${{ secrets.FILES_PAT }}
          DISCORD_NOTIFY_WEBHOOK: ${{ secrets.DISCORD_NOTIFY_WEBHOOK }}
          RENEW_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          . 'C:\ProgramData\ryder\lib.ps1'

          $ts       = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $limit    = 355   # minutes - keep equal to timeout-minutes
          $jobStart = [DateTimeOffset]::FromUnixTimeSeconds([long]$env:JOB_START)
          $jobStartUtc = $jobStart.UtcDateTime
          $sessionStartMs = $jobStart.ToUnixTimeMilliseconds()
          $hasFiles = -not [string]::IsNullOrWhiteSpace($env:FILES_PAT)

          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP   (or the name: ryder)"
          Write-Host "Username: RDP"

          # ---------- password page (only when no RDP_PASSWORD secret was given) ----------
          function Start-PasswordPage {
            $url = "http://$($env:TAILSCALE_IP):8080/"
            $global:pwJob = Start-Job -ArgumentList $url, $env:RDP_PASSWORD -ScriptBlock {
              param($url, $pw)
              $listener = New-Object System.Net.HttpListener
              $listener.Prefixes.Add($url)
              $listener.Start()
              while ($listener.IsListening) {
                $ctx = $listener.GetContext()
                $body = [System.Text.Encoding]::UTF8.GetBytes("Username: RDP`nPassword: $pw`n")
                $ctx.Response.ContentType = 'text/plain'
                $ctx.Response.OutputStream.Write($body, 0, $body.Length)
                $ctx.Response.Close()
              }
            }
          }
          if ($env:SERVE_PASSWORD -eq 'true') {
            Start-PasswordPage
            Write-Host "Password: open http://$($env:TAILSCALE_IP):8080/ from a device on your Tailscale network"
          }
          else { Write-Host "Password: your RDP_PASSWORD secret" }
          Write-Host "==================`n"

          # ---------- auto-renew: start a fresh session before GitHub's 6-hour limit ----------
          function Start-Renewal {
            # returns 'ok', 'limit' or 'fail'
            $count = 0; [void][int]::TryParse($env:RENEW_COUNT, [ref]$count)
            $max   = 0; [void][int]::TryParse($env:MAX_RENEWALS, [ref]$max)   # 0 = unlimited
            if ($max -gt 0 -and $count -ge $max) {
              Send-Notify -Title '⚠️ وصلنا حد التجديد' -Kind warn `
                -Description "تم $count تجديد من أصل $max. ما راح تنشأ جلسة جديدة تلقائياً. شغّل /start لو تريد تكمل (تقدر ترفع max_renewals أو تخليه 0 = بلا حد)."
              return 'limit'
            }

            # Save C:\Work first so the new session restores the latest state
            if ($script:allowWork -and $hasFiles) {
              try { Write-Host ("Work backup before renewal: " + (Backup-Work)) }
              catch { Write-Host "Work backup before renewal failed: $($_.Exception.Message)" }
            }

            $wf = ($env:GITHUB_WORKFLOW_REF -split '@')[0] -replace '^.*/\.github/workflows/', ''
            $old = $env:GH_TOKEN
            $env:GH_TOKEN = $env:RENEW_TOKEN
            try {
              & gh workflow run $wf --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF_NAME `
                -f "preset=$env:PRESET" `
                -f "install_vscode=$env:INSTALL_VSCODE" `
                -f "install_discord=$env:INSTALL_DISCORD" `
                -f "extra_tools=$env:EXTRA_TOOLS" `
                -f "auto_renew=true" `
                -f "max_renewals=$max" `
                -f "renew_count=$($count + 1)" `
                -f "remote_exec=$env:REMOTE_EXEC" 2>&1 | Out-Host
              $code = $LASTEXITCODE
            }
            finally { $env:GH_TOKEN = $old }

            if ($code -ne 0) { return 'fail' }

            New-Item -ItemType File -Path 'C:\ProgramData\ryder\renewed.flag' -Force | Out-Null
            $script:allowWork = $false
            Send-Notify -Title '🔁 جلسة جديدة قيد التجهيز' -Kind info `
              -Description ("بدأت جلسة جديدة تلقائياً قبل ما تنتهي هذي. تجيك رسالة جاهزية بعد دقائق، وقتها انتقل إليها.`n" +
                            "من هسه، تغييرات C:\Work بهذي الجلسة ما تنحفظ تلقائياً (آخر نسخة انحفظت قبل التجديد). ملفات Outbox تبقى تنرفع.")
            return 'ok'
          }

          # ---------- remote exec (only when REMOTE_EXEC=true; commands come from the bot's /exec) ----------
          $script:lastCmdId = $null
          function Invoke-RemoteExec {
            $resp = Invoke-GhFiles api "repos/$($env:FILES_REPO)/contents/control/cmd.json"
            if ($LASTEXITCODE -ne 0 -or -not $resp) { return }
            $meta = ($resp | Out-String) | ConvertFrom-Json
            if (-not $meta.content) { return }
            $json = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($meta.content -replace '\s', '')))
            $cmd = $json | ConvertFrom-Json
            if (-not $cmd.id -or $cmd.id -eq $script:lastCmdId) { return }
            $script:lastCmdId = $cmd.id
            if ([long]$cmd.ts -lt $sessionStartMs) { return }   # old command from a previous session

            Write-Host "[exec] running command $($cmd.id)"
            $fence = '```'
            Send-Notify -Title '🔧 تنفيذ أمر' -Kind info -Description ($fence + "`n" + $cmd.cmd + "`n" + $fence)

            $job = Start-Job -ArgumentList $cmd.cmd -ScriptBlock {
              param($c)
              $ErrorActionPreference = 'Continue'
              & ([scriptblock]::Create($c)) 2>&1 | Out-String -Width 200
            }
            if (Wait-Job $job -Timeout 120) { $out = Receive-Job $job }
            else { Stop-Job $job; $out = 'timeout after 120 seconds' }
            Remove-Job $job -Force -ErrorAction SilentlyContinue

            $out = ([string]$out).Trim()
            if ($out.Length -gt 1500) { $out = $out.Substring($out.Length - 1500) }
            if (-not $out) { $out = '(no output)' }
            Send-Notify -Title '✅ نتيجة الأمر' -Kind ok -Description ($fence + "`n" + $out + "`n" + $fence)
          }

          # ---------- main loop ----------
          $script:allowWork = $true
          $renewState = 'pending'    # pending | ok | limit | gaveup
          $renewTries = 0
          $finalDone = $false
          $warned = @{}
          $tick = 0

          while ($true) {
            Start-Sleep -Seconds 15
            $tick++
            $left = [int]($limit - ((Get-Date).ToUniversalTime() - $jobStartUtc).TotalMinutes)

            # health checks every 30 s: bring back anything that stopped
            if ($tick % 2 -eq 0) {
              try {
                if ((Get-Service -Name TermService).Status -ne 'Running') {
                  Write-Host "[watchdog] TermService stopped - starting it"
                  Start-Service -Name TermService
                }
                & $ts status *> $null
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "[watchdog] Tailscale not healthy - restarting the service"
                  Restart-Service -Name Tailscale -Force
                  Start-Sleep -Seconds 10
                }
                if ($env:SERVE_PASSWORD -eq 'true' -and $global:pwJob.State -ne 'Running') {
                  Write-Host "[watchdog] password page stopped - restarting it"
                  Start-PasswordPage
                }
              }
              catch { Write-Host "[watchdog] check failed: $($_.Exception.Message)" }
            }

            # remote commands every 15 s (off unless REMOTE_EXEC=true)
            if ($env:REMOTE_EXEC -eq 'true' -and $hasFiles) {
              try { Invoke-RemoteExec } catch { Write-Host "[exec] failed: $($_.Exception.Message)" }
            }

            # backups: Outbox every 2 min, Work every 10 min
            if ($hasFiles) {
              if ($tick % 8 -eq 0) {
                try { $r = Backup-Outbox; if ($r -ne 'nothing new') { Write-Host "[backup] Outbox: $r" } }
                catch { Write-Host "[backup] Outbox failed: $($_.Exception.Message)" }
              }
              if ($script:allowWork -and $tick % 40 -eq 0) {
                try { $r = Backup-Work; if ($r -ne 'unchanged') { Write-Host "[backup] Work: $r" } }
                catch {
                  Write-Host "[backup] Work failed: $($_.Exception.Message)"
                  Send-Notify -Title '⚠️ فشل حفظ Work' -Kind warn -Description $_.Exception.Message
                }
              }
            }

            # auto-renew about 30 minutes before the limit
            if ($env:AUTO_RENEW -eq 'true' -and $renewState -eq 'pending' -and $left -le 30) {
              $renewTries++
              try { $res = Start-Renewal } catch { $res = 'fail'; Write-Host "[renew] error: $($_.Exception.Message)" }
              if ($res -eq 'ok') { $renewState = 'ok' }
              elseif ($res -eq 'limit') { $renewState = 'limit' }
              elseif ($renewTries -ge 3) {
                $renewState = 'gaveup'
                Send-Notify -Title '❌ فشل التجديد التلقائي' -Kind err `
                  -Description 'جربت 3 مرات وما نجح. تأكد إن الـ workflow عنده صلاحية actions: write، أو شغّل /start يدوياً قبل ما تنتهي الجلسة.'
              }
              else { Write-Host "[renew] attempt $renewTries failed - will retry" }
            }

            # last backup when no renewal is coming
            if (-not $finalDone -and $left -le 4 -and $script:allowWork -and $hasFiles) {
              $finalDone = $true
              try { Write-Host ("[final] Outbox: " + (Backup-Outbox)); Write-Host ("[final] Work: " + (Backup-Work)) }
              catch { Write-Host "[final] backup failed: $($_.Exception.Message)" }
            }

            # warnings inside the session (popup) and on Discord
            foreach ($m in 30, 10, 5, 2) {
              if ($left -le $m -and -not $warned[$m]) {
                $warned[$m] = $true
                if ($renewState -eq 'ok') { $txt = "هذي الجلسة تنتهي بعد حوالي $m دقيقة. انتقل للجلسة الجديدة." }
                elseif ($m -eq 30 -and $env:AUTO_RENEW -eq 'true') { continue }
                else { $txt = "الجلسة تنتهي بعد حوالي $m دقيقة. احفظ شغلك." }
                Write-Host "!!! $txt"
                msg.exe * /time:120 "Ryder: $txt" 2>$null
                if ($m -le 10) { Send-Notify -Title "⏰ بعد $m دقيقة" -Kind warn -Description $txt }
              }
            }

            if ($tick % 20 -eq 0) {
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] RDP active - about $left min left (cancel the run to stop)"
            }
          }

      - name: Cleanup (final backup, notify, Tailscale logout)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          FILES_PAT: ${{ secrets.FILES_PAT }}
          DISCORD_NOTIFY_WEBHOOK: ${{ secrets.DISCORD_NOTIFY_WEBHOOK }}
        run: |
          $ErrorActionPreference = 'Continue'
          $libPath = 'C:\ProgramData\ryder\lib.ps1'
          $hasLib = Test-Path $libPath
          if ($hasLib) { . $libPath }

          $renewed = Test-Path 'C:\ProgramData\ryder\renewed.flag'

          if ($hasLib -and -not [string]::IsNullOrWhiteSpace($env:FILES_PAT)) {
            try { Write-Host ("Outbox: " + (Backup-Outbox)) } catch { Write-Host "Outbox backup failed: $($_.Exception.Message)" }
            if (-not $renewed) {
              try { Write-Host ("Work: " + (Backup-Work)) } catch { Write-Host "Work backup failed: $($_.Exception.Message)" }
            } else {
              Write-Host "Work backup skipped: a renewed session already took over."
            }
          }

          if ($hasLib) {
            $text = switch ($env:JOB_STATUS) {
              'cancelled' { 'انتهت الجلسة (إلغاء). غالباً وصلت سقف GitHub (حوالي 6 ساعات) أو انلغت يدوياً.' }
              'failure'   { 'انتهت الجلسة بخطأ. شوف السجل.' }
              default     { 'انتهت الجلسة.' }
            }
            if ($renewed) { $text += ' الجلسة الجديدة تكمل مكانها.' }
            Send-Notify -Title '🔴 انتهت الجلسة' -Description $text -Kind warn `
              -Fields @(@{ name = 'السجل'; value = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"; inline = $false })
          }

          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
