name: win + tailscale + Download.bat script

# Safe to keep in a PUBLIC repository:
#  - No password is ever written in this file or printed in the logs.
#  - RDP (3389) and the password page (8080) are reachable ONLY from your Tailscale network.
#
# Needed secret:   TAILSCALE_AUTHKEY   (use an Ephemeral + tagged key)
# Optional secrets:
#   RDP_PASSWORD          - your own strong password (12+ chars). If missing, a random one is
#                           generated and served on  http://<tailscale-ip>:8080  (tailnet only).
#   DOWNLOADS_BAT_SHA256  - SHA-256 of Downloads.bat. If set, the script runs only if it matches.

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          $ErrorActionPreference = 'Stop'

          # Enable Remote Desktop with NLA ON
          $ts  = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts  -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcp -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $tcp -Name 'SecurityLayer'      -Value 2 -Force

          # Close any built-in RDP rules, then allow 3389 ONLY from Tailscale addresses
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # RDP over UDP = noticeably lower latency (still Tailscale-only)
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $password = $env:RDP_PASSWORD_SECRET
          $serve = 'false'

          if ([string]::IsNullOrWhiteSpace($password)) {
            # No secret provided: generate a random password (never printed to the log)
            $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'.ToCharArray()
            $bytes = New-Object byte[] 20
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = (($bytes | ForEach-Object { $chars[$_ % $chars.Length] }) -join '') + '-Aa1'
            $serve = 'true'
          }
          elseif ($password.Length -lt 12) {
            Write-Error "Secret RDP_PASSWORD is shorter than 12 characters."
            exit 1
          }

          # Mask it so it can never appear in the logs by accident
          Write-Host "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
          # Remove the next line if you don't need admin rights inside the session
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP')) {
            Write-Error "User creation failed"
            exit 1
          }

          if ($serve -eq 'true') {
            # Password page: reachable ONLY from Tailscale addresses
            Remove-NetFirewallRule -DisplayName 'PW-Tailscale' -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName 'PW-Tailscale' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 `
              -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null
          }

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          "SERVE_PASSWORD=$serve"  >> $env:GITHUB_ENV
          Write-Host "RDP user is ready."

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing

          # Make sure the installer is really signed by Tailscale
          $sig = Get-AuthenticodeSignature $installerPath
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') {
            Write-Error "Tailscale installer signature check failed."
            exit 1
          }

          Start-Process msiexec.exe -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey=$env:TS_AUTHKEY "--hostname=gh-runner-$($env:GITHUB_RUN_ID)" `
            --unattended --accept-dns=false --accept-routes=false

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Fetch Downloads.bat
        env:
          DOWNLOADS_BAT_SHA256: ${{ secrets.DOWNLOADS_BAT_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadUrl = 'https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat'
          $tmpPath = "$env:RUNNER_TEMP\Downloads.bat"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $tmpPath -UseBasicParsing

          if ([string]::IsNullOrWhiteSpace($env:DOWNLOADS_BAT_SHA256)) {
            Write-Warning "DOWNLOADS_BAT_SHA256 not set - running Downloads.bat without integrity check."
          }
          else {
            $actual = (Get-FileHash -Path $tmpPath -Algorithm SHA256).Hash
            if ($actual -ne $env:DOWNLOADS_BAT_SHA256.Trim().ToUpper()) {
              Write-Error "Downloads.bat hash mismatch - NOT running it."
              exit 1
            }
            Write-Host "Downloads.bat hash verified."
          }

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

          if ($env:SERVE_PASSWORD -eq 'true') {
            $url = "http://$($env:TAILSCALE_IP):8080/"
            Start-Job -ArgumentList $url, $env:RDP_PASSWORD -ScriptBlock {
              param($url, $pw)
              $listener = New-Object System.Net.HttpListener
              $listener.Prefixes.Add($url)
              $listener.Start()
              while ($listener.IsListening) {
                $ctx = $listener.GetContext()
                $body = [System.Text.Encoding]::UTF8.GetBytes("Username: RDP`nPassword: $pw`n")
                $ctx.Response.ContentType = 'text/plain'
                $ctx.Response.OutputStream.Write($body, 0, $body.Length)
                $ctx.Response.Close()
              }
            } | Out-Null
            Write-Host "Password: open $url from a device on your Tailscale network"
          }
          else {
            Write-Host "Password: your RDP_PASSWORD secret"
          }
          Write-Host "==================`n"

          $rdpProfile   = 'C:\Users\RDP'
          $startupPath  = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadPath = "$startupPath\Downloads.bat"
          $verifiedPath = "$env:RUNNER_TEMP\Downloads.bat"

          while ($true) {
            if (Test-Path $rdpProfile) {
              try {
                if (-not (Test-Path $startupPath)) {
                  New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                }
                Copy-Item -Path $verifiedPath -Destination $downloadPath -Force
                Write-Host "Downloads.bat copied to $downloadPath"

                cmd /c $downloadPath
                Write-Host "Downloads.bat executed successfully"
                break
              }
              catch {
                Write-Host "Error copying or executing Downloads.bat: $($_.Exception.Message)"
                break
              }
            }
            else {
              Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
              Start-Sleep -Seconds 30
            }
          }

          # Keep runner alive
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - cancel the workflow run to terminate"
            Start-Sleep -Seconds 300
          }

      - name: Cleanup Tailscale
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
