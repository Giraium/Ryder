name: Ryder - Windows + Tailscale + RDP (v3)

# ---------------------------------------------------------------------------------------------
# Secrets used by this workflow (Settings > Secrets and variables > Actions):
#   TAILSCALE_AUTHKEY        required   (Ephemeral + tagged key)
#   RDP_PASSWORD             recommended (12+ chars). Without it a random one is served on http://<tailscale-ip>:8080
#   FILES_PAT                for the private files repo (fine-grained token, repo Giraium/Ryder-files, Contents: Read and write)
#   DISCORD_NOTIFY_WEBHOOK   webhook of the ryder-notify channel
#
# v3 adds:
#   - Files: a private repo (Giraium/Ryder-files) is the shared folder.
#       drop/ folder in the repo + assets of the release named "drop"  -> C:\Drop  -> copied into Downloads at RDP logon
#       C:\Work    is backed up every 10 min to release "work" (work.zip) and restored in the next session
#       C:\Outbox  new/changed files are uploaded every 2 min to release "outbox"
#   - Auto-renew: ~30 min before GitHub's 6-hour job limit a fresh session is started automatically.
#   - Discord notifications (starting / ready / warnings / ended) and optional remote commands from the bot.
#   - No idle shutdown of any kind.
# ---------------------------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Tool preset (installed through Chocolatey)"
        type: choice
        options:
          - minimal
          - dev
          - security-lab
        default: minimal
      install_vscode:
        description: "Install Visual Studio Code"
        type: boolean
        default: true
      install_discord:
        description: "Install Discord and open it (with Brave) when you log in over RDP"
        type: boolean
        default: true
      extra_tools:
        description: "Extra Chocolatey packages, comma separated (example: nmap,7zip). Empty = none"
        type: string
        default: ""
      auto_renew:
        description: "Start a fresh session automatically before the 6-hour limit"
        type: boolean
        default: true
      max_renewals:
        description: "Maximum automatic renewals in a row (0 = unlimited)"
        type: string
        default: "8"
      remote_exec:
        description: "Allow the Discord bot to run commands in this session (/exec)"
        type: boolean
        default: false
      renew_count:
        description: "(internal) how many renewals happened so far"
        type: string
        default: "0"

permissions: {}

env:
  FILES_REPO: Giraium/Ryder-files

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 355
    permissions:
      actions: write   # lets the session start its own replacement (gh workflow run)

    steps:
      - name: Configure Core RDP Settings
        run: |
          $ErrorActionPreference = 'Stop'

          # Remember when the job started (used by the watchdog to count the remaining time)
          "JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV

          # Enable Remote Desktop with NLA ON
          $ts  = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts  -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcp -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $tcp -Name 'SecurityLayer'      -Value 2 -Force

          # Close any built-in RDP rules, then allow 3389 ONLY from Tailscale addresses
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # RDP over UDP = noticeably lower latency (still Tailscale-only)
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # Windows Audio is off by default on the runner: enable it so sound works over RDP
          foreach ($svc in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name $svc -ErrorAction SilentlyContinue
          }

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $password = $env:RDP_PASSWORD_SECRET
          $serve = 'false'

          if ([string]::IsNullOrWhiteSpace($password)) {
            # No secret provided: generate a random password (never printed to the log)
            $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'.ToCharArray()
            $bytes = New-Object byte[] 20
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = (($bytes | ForEach-Object { $chars[$_ % $chars.Length] }) -join '') + '-Aa1'
            $serve = 'true'
          }
          elseif ($password.Length -lt 12) {
            Write-Error "Secret RDP_PASSWORD is shorter than 12 characters."
            exit 1
          }

          # Mask it so it can never appear in the logs by accident
          Write-Host "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
          # Remove the next line if you don't need admin rights inside the session
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP')) {
            Write-Error "User creation failed"
            exit 1
          }

          if ($serve -eq 'true') {
            # Password page: reachable ONLY from Tailscale addresses
            Remove-NetFirewallRule -DisplayName 'PW-Tailscale' -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName 'PW-Tailscale' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 `
              -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null
          }

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          "SERVE_PASSWORD=$serve"  >> $env:GITHUB_ENV
          Write-Host "RDP user is ready."

      - name: Tune display, quality and speed
        run: |
          # Best-effort tuning: a failure here never stops the workflow
          $ErrorActionPreference = 'Continue'

          function Set-Reg($path, $name, $value, $type) {
            if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
            Set-ItemProperty -Path $path -Name $name -Value $value -Type $type -Force
          }

          # 1) High performance power plan (no CPU throttling)
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c | Out-Null

          # 2) Time zone: Baghdad
          Set-TimeZone -Id 'Arabian Standard Time' -ErrorAction SilentlyContinue

          # 3) Keep RDP sessions alive: no idle/disconnect limits, keep-alive packets
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          foreach ($name in 'MaxIdleTime', 'MaxDisconnectionTime', 'MaxConnectionTime') {
            Set-Reg $pol $name 0 'DWord'
          }
          Set-Reg $pol 'KeepAliveEnable' 1 'DWord'
          Set-Reg $pol 'KeepAliveInterval' 1 'DWord'

          # 3b) Frame rate: RDP's maximum is 60 FPS (default is 30). 15 ms per frame = 60 FPS.
          Set-Reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' 'DWMFRAMEINTERVAL' 15 'DWord'

          # 4) Stop background services that waste CPU and disk
          foreach ($svc in 'WSearch', 'SysMain') {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # 5) Defaults for the RDP user (copied from the Default profile at first logon):
          #    no animations/transparency/wallpaper/screensaver, but crisp ClearType text
          $hive = 'C:\Users\Default\NTUSER.DAT'
          if (Test-Path $hive) {
            reg load HKU\DefUser $hive | Out-Null
            try {
              $k = 'Registry::HKEY_USERS\DefUser'
              $desk = "$k\Control Panel\Desktop"
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" 'VisualFXSetting' 2 'DWord'
              Set-Reg $desk 'UserPreferencesMask' ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) 'Binary'
              Set-Reg $desk 'MenuShowDelay' '0' 'String'
              Set-Reg $desk 'FontSmoothing' '2' 'String'
              Set-Reg $desk 'FontSmoothingType' 2 'DWord'
              Set-Reg $desk 'ScreenSaveActive' '0' 'String'
              Set-Reg $desk 'Wallpaper' '' 'String'
              Set-Reg "$desk\WindowMetrics" 'MinAnimate' '0' 'String'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" 'EnableTransparency' 0 'DWord'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" 'TaskbarAnimations' 0 'DWord'
              Write-Host "Display tuning applied to the default profile."
            }
            catch {
              Write-Host "Display tuning skipped: $($_.Exception.Message)"
            }
            finally {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKU\DefUser | Out-Null
            }
          }

      - name: Write helper library
        run: |
          New-Item -ItemType Directory -Path 'C:\ProgramData\ryder' -Force | Out-Null
          $lib = @'
          # Ryder helper library - written to C:\ProgramData\ryder\lib.ps1 and dot-sourced by later steps
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'

          # ---------- Discord notifications (channel: ryder-notify) ----------
          function Send-Notify {
            param(
              [string]$Title,
              [string]$Description = '',
              [string]$Kind = 'info',
              [hashtable[]]$Fields = @()
            )
            if ([string]::IsNullOrWhiteSpace($env:DISCORD_NOTIFY_WEBHOOK)) { return }
            $colors = @{ ok = 3066993; warn = 15844367; err = 15158332; info = 3447003 }
            $embed = @{
              title       = $Title
              description = $Description
              color       = $colors[$Kind]
              timestamp   = (Get-Date).ToUniversalTime().ToString('o')
              footer      = @{ text = 'Ryder' }
            }
            if ($Fields.Count -gt 0) {
              $embed.fields = @($Fields | ForEach-Object {
                @{ name = [string]$_.name; value = [string]$_.value; inline = [bool]$_.inline }
              })
            }
            $payload = @{ username = 'Ryder'; allowed_mentions = @{ parse = @() }; embeds = @($embed) } | ConvertTo-Json -Depth 6 -Compress
            try {
              Invoke-RestMethod -Uri $env:DISCORD_NOTIFY_WEBHOOK -Method Post `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([System.Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            }
            catch { Write-Host "[notify] failed: $($_.Exception.Message)" }
          }

          # ---------- GitHub CLI against the private files repo ----------
          function Invoke-GhFiles {
            # Uses FILES_PAT only for this one call, then puts the previous token back
            $old = $env:GH_TOKEN
            $env:GH_TOKEN = $env:FILES_PAT
            try { & gh @args 2>&1 }
            finally { $env:GH_TOKEN = $old }
          }

          function Initialize-Release([string]$Tag) {
            Invoke-GhFiles release view $Tag --repo $env:FILES_REPO *> $null
            if ($LASTEXITCODE -ne 0) {
              Invoke-GhFiles release create $Tag --repo $env:FILES_REPO --title $Tag --notes 'managed by Ryder' | Out-Null
              if ($LASTEXITCODE -ne 0) {
                throw "cannot create release '$Tag' (does the files repo have at least one commit, and does FILES_PAT have Contents: write?)"
              }
            }
          }

          # ---------- Restore: Drop folder + last Work backup ----------
          function Restore-State {
            New-Item -ItemType Directory -Path 'C:\Drop', 'C:\Work', 'C:\Outbox' -Force | Out-Null
            $info = [ordered]@{ drop_repo = 0; drop_release = 0; work = 'none' }

            # 1) files placed in the "drop" folder of the files repo
            try {
              $tmp = Join-Path $env:TEMP 'files-clone'
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
              $b64 = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$($env:FILES_PAT)"))
              Write-Host "::add-mask::$b64"
              git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $b64" clone --depth 1 --quiet "https://github.com/$($env:FILES_REPO).git" $tmp 2>&1 | Out-Null
              if (Test-Path "$tmp\drop") {
                Copy-Item -Path "$tmp\drop\*" -Destination 'C:\Drop' -Recurse -Force
                $info.drop_repo = @(Get-ChildItem 'C:\Drop' -Recurse -File).Count
              }
              Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            }
            catch { Write-Host "[restore] drop folder failed: $($_.Exception.Message)" }

            # 2) assets of the release named "drop" (use this for big files, up to 2 GB each)
            try {
              Invoke-GhFiles release download drop --repo $env:FILES_REPO --dir 'C:\Drop' --clobber | Out-Null
              $info.drop_release = @(Get-ChildItem 'C:\Drop' -Recurse -File).Count
            }
            catch { Write-Host "[restore] drop release failed: $($_.Exception.Message)" }

            # 3) last backup of C:\Work
            try {
              $zipDir = Join-Path $env:TEMP 'work-restore'
              New-Item -ItemType Directory -Path $zipDir -Force | Out-Null
              Invoke-GhFiles release download work --repo $env:FILES_REPO --pattern 'work.zip' --dir $zipDir --clobber | Out-Null
              if (Test-Path "$zipDir\work.zip") {
                tar.exe -xf "$zipDir\work.zip" -C 'C:\Work'
                $info.work = 'restored'
              }
            }
            catch { Write-Host "[restore] work failed: $($_.Exception.Message)" }

            return $info
          }

          # ---------- Backup: C:\Work -> release "work" (one work.zip, replaced each time) ----------
          function Backup-Work {
            if (-not (Test-Path 'C:\Work')) { return 'no Work folder' }
            $skip = '\\(node_modules|\.venv|__pycache__)\\'
            $files = @(Get-ChildItem 'C:\Work' -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch $skip })
            if ($files.Count -eq 0) { return 'Work is empty - nothing to back up' }

            $sum = ($files | Measure-Object -Property Length -Sum).Sum
            $newest = ($files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1).LastWriteTimeUtc.Ticks
            $sig = "$sum|$($files.Count)|$newest"
            if ($script:LastWorkSig -eq $sig) { return 'unchanged' }

            $zip = Join-Path $env:TEMP 'work.zip'
            Remove-Item $zip -Force -ErrorAction SilentlyContinue
            tar.exe -a -c -f $zip --exclude=node_modules --exclude=.venv --exclude=__pycache__ -C 'C:\Work' .
            if ($LASTEXITCODE -gt 1) { throw "tar failed (exit $LASTEXITCODE)" }

            $len = (Get-Item $zip).Length
            $mb = [math]::Round($len / 1MB, 1)
            if ($len -gt 1.9GB) { throw "work.zip is $mb MB - above the 2 GB release-asset limit; move big files out of C:\Work" }

            Initialize-Release 'work'
            Invoke-GhFiles release upload work $zip --repo $env:FILES_REPO --clobber | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'upload of work.zip failed' }
            $script:LastWorkSig = $sig
            return "uploaded ($mb MB)"
          }

          # ---------- Backup: C:\Outbox -> release "outbox" (every new/changed file) ----------
          function Backup-Outbox {
            if (-not (Test-Path 'C:\Outbox')) { return 'no Outbox folder' }
            if (-not $script:OutboxSeen) { $script:OutboxSeen = @{} }
            $pending = @()
            foreach ($f in Get-ChildItem 'C:\Outbox' -Recurse -File -ErrorAction SilentlyContinue) {
              $stamp = "$($f.Length)|$($f.LastWriteTimeUtc.Ticks)"
              if ($script:OutboxSeen[$f.FullName] -ne $stamp) { $pending += $f }
            }
            if ($pending.Count -eq 0) { return 'nothing new' }

            Initialize-Release 'outbox'
            $ok = 0
            foreach ($f in $pending) {
              if ($f.Length -gt 1.9GB) { Write-Host "[outbox] skipped (over 2 GB): $($f.Name)"; continue }
              Invoke-GhFiles release upload outbox $f.FullName --repo $env:FILES_REPO --clobber | Out-Null
              if ($LASTEXITCODE -eq 0) {
                $script:OutboxSeen[$f.FullName] = "$($f.Length)|$($f.LastWriteTimeUtc.Ticks)"
                $ok++
              }
            }
            return "$ok file(s) uploaded"
          }
          '@
          Set-Content -Path 'C:\ProgramData\ryder\lib.ps1' -Value $lib -Encoding UTF8

      - name: Provision apps and dev environment
        env:
          PRESET: ${{ inputs.preset }}
          INSTALL_VSCODE: ${{ inputs.install_vscode }}
          INSTALL_DISCORD: ${{ inputs.install_discord }}
          EXTRA_TOOLS: ${{ inputs.extra_tools }}
        run: |
          # Everything here runs BEFORE Tailscale comes up, so the RDP user's first logon already
          # sees Brave as default browser, the shortcuts and the tools. Every section is best-effort:
          # one failure is printed in the log and never stops the session.
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          function Invoke-Section([string]$Name, [scriptblock]$Body) {
            Write-Host "::group::$Name"
            try { & $Body; Write-Host "[ok] $Name" }
            catch { Write-Host "[FAILED] $Name : $($_.Exception.Message)" }
            Write-Host "::endgroup::"
          }

          function Get-Signed([string]$Url, [string]$Out, [string]$Signer) {
            for ($i = 1; $i -le 3; $i++) {
              try { Invoke-WebRequest -Uri $Url -OutFile $Out -UseBasicParsing -MaximumRedirection 10; break }
              catch { if ($i -eq 3) { throw }; Start-Sleep -Seconds 3 }
            }
            $sig = Get-AuthenticodeSignature $Out
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch $Signer) {
              Remove-Item $Out -Force -ErrorAction SilentlyContinue
              throw "signature check failed (status=$($sig.Status)) for $Url"
            }
          }

          function New-Shortcut([string]$Path, [string]$Target, [string]$Arguments = '', [string]$Icon = '') {
            $w = New-Object -ComObject 
