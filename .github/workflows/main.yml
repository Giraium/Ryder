name: win + tailscale + apps

# Safe to keep in a PUBLIC repository:
#  - No password is ever written in this file or printed in the logs.
#  - RDP (3389) and the password page (8080) are reachable ONLY from your Tailscale network.
#
# Needed secret:   TAILSCALE_AUTHKEY   (use an Ephemeral + tagged key)
# Optional secrets:
#   RDP_PASSWORD          - your own strong password (12+ chars). If missing, a random one is
#                           generated and served on  http://<tailscale-ip>:8080  (tailnet only).
#
# No third-party scripts are downloaded or run. Apps (Steam, VLC, Brave, VS Code, Discord) come
# from the vendors' official download links and are installed only if their digital signature is valid.

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: pwsh

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          $ErrorActionPreference = 'Stop'

          # Enable Remote Desktop with NLA ON
          $ts  = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcp = "$ts\WinStations\RDP-Tcp"
          Set-ItemProperty -Path $ts  -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $tcp -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $tcp -Name 'SecurityLayer'      -Value 2 -Force

          # Close any built-in RDP rules, then allow 3389 ONLY from Tailscale addresses
          Disable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # RDP over UDP = noticeably lower latency (still Tailscale-only)
          Remove-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName 'RDP-Tailscale-UDP' `
            -Direction Inbound -Action Allow -Protocol UDP -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null

          # Windows Audio is off by default on the runner: enable it so sound works over RDP
          foreach ($svc in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service -Name $svc -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name $svc -ErrorAction SilentlyContinue
          }

          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASSWORD_SECRET: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          $password = $env:RDP_PASSWORD_SECRET
          $serve = 'false'

          if ([string]::IsNullOrWhiteSpace($password)) {
            # No secret provided: generate a random password (never printed to the log)
            $chars = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'.ToCharArray()
            $bytes = New-Object byte[] 20
            [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
            $password = (($bytes | ForEach-Object { $chars[$_ % $chars.Length] }) -join '') + '-Aa1'
            $serve = 'true'
          }
          elseif ($password.Length -lt 12) {
            Write-Error "Secret RDP_PASSWORD is shorter than 12 characters."
            exit 1
          }

          # Mask it so it can never appear in the logs by accident
          Write-Host "::add-mask::$password"

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name 'RDP' -Password $securePass -AccountNeverExpires -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
          # Remove the next line if you don't need admin rights inside the session
          Add-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name 'RDP')) {
            Write-Error "User creation failed"
            exit 1
          }

          if ($serve -eq 'true') {
            # Password page: reachable ONLY from Tailscale addresses
            Remove-NetFirewallRule -DisplayName 'PW-Tailscale' -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName 'PW-Tailscale' `
              -Direction Inbound -Action Allow -Protocol TCP -LocalPort 8080 `
              -RemoteAddress 100.64.0.0/10 -Profile Any | Out-Null
          }

          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          "SERVE_PASSWORD=$serve"  >> $env:GITHUB_ENV
          Write-Host "RDP user is ready."

      - name: Tune display, quality and speed
        run: |
          # Best-effort tuning: a failure here never stops the workflow
          $ErrorActionPreference = 'Continue'

          function Set-Reg($path, $name, $value, $type) {
            if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
            Set-ItemProperty -Path $path -Name $name -Value $value -Type $type -Force
          }

          # 1) High performance power plan (no CPU throttling)
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c | Out-Null

          # 2) Time zone: Baghdad
          Set-TimeZone -Id 'Arabian Standard Time' -ErrorAction SilentlyContinue

          # 3) Keep RDP sessions alive: no idle/disconnect limits, keep-alive packets
          $pol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          foreach ($name in 'MaxIdleTime', 'MaxDisconnectionTime', 'MaxConnectionTime') {
            Set-Reg $pol $name 0 'DWord'
          }
          Set-Reg $pol 'KeepAliveEnable' 1 'DWord'
          Set-Reg $pol 'KeepAliveInterval' 1 'DWord'

          # 3b) Frame rate: RDP's maximum is 60 FPS (default is 30). 15 ms per frame = 60 FPS.
          Set-Reg 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations' 'DWMFRAMEINTERVAL' 15 'DWord'

          # 4) Stop background services that waste CPU and disk
          foreach ($svc in 'WSearch', 'SysMain') {
            Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
            Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
          }

          # 5) Defaults for the RDP user (copied from the Default profile at first logon):
          #    no animations/transparency/wallpaper/screensaver, but crisp ClearType text
          $hive = 'C:\Users\Default\NTUSER.DAT'
          if (Test-Path $hive) {
            reg load HKU\DefUser $hive | Out-Null
            try {
              $k = 'Registry::HKEY_USERS\DefUser'
              $desk = "$k\Control Panel\Desktop"
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" 'VisualFXSetting' 2 'DWord'
              Set-Reg $desk 'UserPreferencesMask' ([byte[]](0x90,0x12,0x03,0x80,0x10,0x00,0x00,0x00)) 'Binary'
              Set-Reg $desk 'MenuShowDelay' '0' 'String'
              Set-Reg $desk 'FontSmoothing' '2' 'String'
              Set-Reg $desk 'FontSmoothingType' 2 'DWord'
              Set-Reg $desk 'ScreenSaveActive' '0' 'String'
              Set-Reg $desk 'Wallpaper' '' 'String'
              Set-Reg "$desk\WindowMetrics" 'MinAnimate' '0' 'String'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" 'EnableTransparency' 0 'DWord'
              Set-Reg "$k\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" 'TaskbarAnimations' 0 'DWord'
              Write-Host "Display tuning applied to the default profile."
            }
            catch {
              Write-Host "Display tuning skipped: $($_.Exception.Message)"
            }
            finally {
              [gc]::Collect()
              [gc]::WaitForPendingFinalizers()
              reg unload HKU\DefUser | Out-Null
            }
          }

      - name: Prepare app setup (official installers, signature-checked)
        run: |
          $ErrorActionPreference = 'Stop'

          $setup = @'
          param([ValidateSet('System','User')][string]$Mode = 'User')
          $ErrorActionPreference = 'Continue'

          function Install-App {
            param($Name, $Url, $Vendor, $InstallArgs, [switch]$NoWait)
            $file = Join-Path $env:TEMP "$Name-setup.exe"
            try {
              Invoke-WebRequest -Uri $Url -OutFile $file -UseBasicParsing
              $sig = Get-AuthenticodeSignature $file
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch $Vendor) {
                Write-Host "${Name}: signature check failed - skipped."
                return
              }
              if ($NoWait) { Start-Process -FilePath $file -ArgumentList $InstallArgs }
              else { Start-Process -FilePath $file -ArgumentList $InstallArgs -Wait }
              Write-Host "$Name installed."
            }
            catch { Write-Host "$Name failed: $($_.Exception.Message)" }
            finally { if (-not $NoWait) { Remove-Item $file -Force -ErrorAction SilentlyContinue } }
          }

          if ($Mode -eq 'System') {
            # System-wide apps (need admin): installed by the workflow
            Install-App 'Steam' 'https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe' 'Valve' '/S'
            Install-App 'VLC' 'https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.exe' 'VideoLAN' '/L=1033 /S'
            Remove-Item 'C:\Users\Public\Desktop\Epic Games Launcher.lnk', 'C:\Users\Public\Desktop\Unity Hub.lnk' -Force -ErrorAction SilentlyContinue
          }
          else {
            # Per-user apps: installed once, at the RDP user's first logon
            $flag = Join-Path $env:LOCALAPPDATA 'setup_done.flag'
            if (Test-Path $flag) { exit 0 }
            Install-App 'Brave' 'https://laptop-updates.brave.com/latest/winx64' 'Brave' '/silent /install'
            Install-App 'VSCode' 'https://update.code.visualstudio.com/latest/win32-x64-user/stable' 'Microsoft' '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES /MERGETASKS=!runcode,desktopicon'
            Install-App 'Discord' 'https://discord.com/api/download?platform=win' 'Discord' '-s' -NoWait
            New-Item -ItemType File -Path $flag -Force | Out-Null
          }
          '@

          Set-Content -Path "$env:ProgramData\setup-apps.ps1" -Value $setup -Encoding UTF8

          # Copied from the Default profile into the RDP user's profile at first logon
          $startup = 'C:\Users\Default\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup'
          New-Item -ItemType Directory -Path $startup -Force | Out-Null

          $cmd = @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "%ProgramData%\setup-apps.ps1" -Mode User
          '@

          Set-Content -Path "$startup\setup-apps.cmd" -Value $cmd -Encoding ASCII
          Write-Host "App setup prepared."

      - name: Install Tailscale
        run: |
          $ErrorActionPreference = 'Stop'
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing

          # Make sure the installer is really signed by Tailscale
          $sig = Get-AuthenticodeSignature $installerPath
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Tailscale') {
            Write-Error "Tailscale installer signature check failed."
            exit 1
          }

          Start-Process msiexec.exe -ArgumentList '/i', "`"$installerPath`"", '/quiet', '/norestart' -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          # Never fall back to a manual login link: in a public repo the log is visible to everyone
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
            Write-Error "Secret TAILSCALE_AUTHKEY is missing in this repository - stopping."
            exit 1
          }

          & $ts up --authkey=$env:TS_AUTHKEY "--hostname=gh-runner-$($env:GITHUB_RUN_ID)" `
            --unattended --accept-dns=false --accept-routes=false --timeout=60s

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1)
            if (-not $tsIP) { Start-Sleep -Seconds 5 }
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

          Write-Host "--- Tailscale network check (UDP / nearest relay) ---"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" netcheck

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

          if ($env:SERVE_PASSWORD -eq 'true') {
            $url = "http://$($env:TAILSCALE_IP):8080/"
            Start-Job -ArgumentList $url, $env:RDP_PASSWORD -ScriptBlock {
              param($url, $pw)
              $listener = New-Object System.Net.HttpListener
              $listener.Prefixes.Add($url)
              $listener.Start()
              while ($listener.IsListening) {
                $ctx = $listener.GetContext()
                $body = [System.Text.Encoding]::UTF8.GetBytes("Username: RDP`nPassword: $pw`n")
                $ctx.Response.ContentType = 'text/plain'
                $ctx.Response.OutputStream.Write($body, 0, $body.Length)
                $ctx.Response.Close()
              }
            } | Out-Null
            Write-Host "Password: open $url from a device on your Tailscale network"
          }
          else {
            Write-Host "Password: your RDP_PASSWORD secret"
          }
          Write-Host "==================`n"

          # System-wide apps (Steam, VLC) install now, while you connect
          try { & "$env:ProgramData\setup-apps.ps1" -Mode System }
          catch { Write-Host "App setup failed (RDP keeps running): $($_.Exception.Message)" }

          # Keep runner alive
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - cancel the workflow run to terminate"
            Start-Sleep -Seconds 300
          }

      - name: Cleanup Tailscale
        if: always()
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout
