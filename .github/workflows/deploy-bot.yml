name: Deploy Ryder Bot

# Deploys bot/worker.js to Cloudflare Workers and registers the slash commands.
# Secrets needed: CF_API_TOKEN, CF_ACCOUNT_ID, DISCORD_BOT_TOKEN, GH_BOT_PAT, FILES_PAT, DISCORD_LOG_WEBHOOK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-bot.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the Worker
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          {
            echo "## Ryder bot deployed"
            echo
            if [ -n "$url" ]; then
              echo "Worker URL: \`$url\`"
              echo
              echo "Paste it in the Discord Developer Portal: your application, General Information, **Interactions Endpoint URL**, then Save."
            else
              echo "Deployed, but the URL was not found in the log. Open the log above and look for the workers.dev address."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Worker secrets
        working-directory: bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
          FILES_PAT: ${{ secrets.FILES_PAT }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          node -e "require('fs').writeFileSync('secrets.json', JSON.stringify({GH_BOT_PAT: process.env.GH_BOT_PAT, FILES_PAT: process.env.FILES_PAT, DISCORD_LOG_WEBHOOK: process.env.DISCORD_LOG_WEBHOOK}))"
          npx --yes wrangler@4 secret bulk secrets.json
          rm -f secrets.json

      - name: Register slash commands in your server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          APP_ID: '1574886180028153927'
          GUILD_ID: '1065284766326341652'
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @bot/commands.json \
            "https://discord.com/api/v10/applications/$APP_ID/guilds/$GUILD_ID/commands")
          echo "Discord answered HTTP $code"
          head -c 400 resp.json; echo
          test "$code" = "200"
