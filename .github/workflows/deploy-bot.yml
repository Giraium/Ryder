name: Deploy Ryder Bot

# Deploys bot/worker.js to Cloudflare Workers, pushes the Worker secrets and
# registers the slash commands in your Discord server.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CF_API_TOKEN, CF_ACCOUNT_ID, DISCORD_BOT_TOKEN, GH_BOT_PAT, FILES_PAT
#   DISCORD_LOG_WEBHOOK  (optional: the bot simply skips logging without it)
#
# Every secret is sanitized before use (spaces, newlines and hidden characters
# removed), so a stray Enter when pasting a secret can no longer break the run.
# APP_ID and GUILD_ID are read from bot/wrangler.toml, the single source of truth.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/deploy-bot.yml'

permissions:
  contents: read

# One deploy at a time; a second run waits instead of racing the first.
concurrency:
  group: deploy-ryder-bot
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail: a failing "wrangler deploy | tee" now fails the step
    # (before, tee's exit code hid the failure and later steps kept running).
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare helpers
        run: |
          cat > "$RUNNER_TEMP/lib.sh" <<'LIB'
          # need NAME RAW [ALLOWED_CHARS]
          # Prints the cleaned secret. Fails if it is empty, warns if it was dirty.
          need() {
            local c
            if [ -n "${3:-}" ]; then
              c="$(printf '%s' "$2" | tr -cd "$3")"
            else
              c="$(printf '%s' "$2" | tr -d '[:space:][:cntrl:]')"
            fi
            if [ -z "$c" ]; then
              echo "::error::Secret $1 is missing or empty." >&2
              return 1
            fi
            if [ "${#c}" -ne "${#2}" ]; then
              echo "::warning::Secret $1 had hidden characters (raw length ${#2}, clean length ${#c}). Cleaned automatically; re-create the secret to silence this." >&2
            fi
            printf '%s' "$c"
          }

          # opt NAME RAW -> cleaned value, or empty (with a notice) for optional secrets.
          opt() {
            local c
            c="$(printf '%s' "$2" | tr -d '[:space:][:cntrl:]')"
            if [ -z "$c" ]; then
              echo "::notice::Optional secret $1 is empty, skipping it." >&2
            fi
            printf '%s' "$c"
          }

          # toml_var KEY -> value of KEY = "..." from bot/wrangler.toml
          toml_var() {
            sed -nE "s/^$1[[:space:]]*=[[:space:]]*\"([^\"]*)\".*/\1/p" bot/wrangler.toml | head -n 1
          }
          LIB

      - name: Deploy the Worker
        working-directory: bot
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          CLOUDFLARE_API_TOKEN="$(need CF_API_TOKEN "$CF_API_TOKEN" 'A-Za-z0-9_-')"
          CLOUDFLARE_ACCOUNT_ID="$(need CF_ACCOUNT_ID "$CF_ACCOUNT_ID" 'A-Za-z0-9_-')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "::warning::CF_ACCOUNT_ID does not look like a 32-character account ID. Copy it from the Cloudflare dashboard (Workers & Pages overview)."
          fi

          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log

          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          {
            echo "## Ryder bot deployed"
            echo
            if [ -n "$url" ]; then
              echo "Worker URL: \`$url\`"
              echo
              echo "Paste it in the Discord Developer Portal: your application, General Information, **Interactions Endpoint URL**, then Save."
            else
              echo "Deployed, but the URL was not found in the log. Open the log above and look for the workers.dev address."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push Worker secrets
        working-directory: bot
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GH_BOT_PAT: ${{ secrets.GH_BOT_PAT }}
          FILES_PAT: ${{ secrets.FILES_PAT }}
          DISCORD_LOG_WEBHOOK: ${{ secrets.DISCORD_LOG_WEBHOOK }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          CLOUDFLARE_API_TOKEN="$(need CF_API_TOKEN "$CF_API_TOKEN" 'A-Za-z0-9_-')"
          CLOUDFLARE_ACCOUNT_ID="$(need CF_ACCOUNT_ID "$CF_ACCOUNT_ID" 'A-Za-z0-9_-')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          gh_pat="$(need GH_BOT_PAT "$GH_BOT_PAT")"
          files_pat="$(need FILES_PAT "$FILES_PAT")"
          log_hook="$(opt DISCORD_LOG_WEBHOOK "$DISCORD_LOG_WEBHOOK")"

          # Keep the secrets file outside the repo, readable only by us, and
          # delete it even if wrangler fails.
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          umask 077
          jq -n --arg gh "$gh_pat" --arg files "$files_pat" --arg hook "$log_hook" \
            '{GH_BOT_PAT: $gh, FILES_PAT: $files} + (if $hook != "" then {DISCORD_LOG_WEBHOOK: $hook} else {} end)' \
            > "$secrets_file"

          npx --yes wrangler@4 secret bulk "$secrets_file"

      - name: Register slash commands in your server
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          . "$RUNNER_TEMP/lib.sh"
          token="$(need DISCORD_BOT_TOKEN "$DISCORD_BOT_TOKEN" 'A-Za-z0-9._-')"

          app_id="$(toml_var APP_ID)"
          guild_id="$(toml_var GUILD_ID)"
          if ! [[ "$app_id" =~ ^[0-9]+$ && "$guild_id" =~ ^[0-9]+$ ]]; then
            echo "::error::APP_ID / GUILD_ID not found (or not numeric) in bot/wrangler.toml [vars]."
            exit 1
          fi

          if ! jq -e 'type == "array" and length > 0' bot/commands.json > /dev/null; then
            echo "::error::bot/commands.json must be a non-empty JSON array."
            exit 1
          fi

          resp="$RUNNER_TEMP/discord-resp.json"
          code="$(curl -sS -o "$resp" -w '%{http_code}' --retry 3 --max-time 30 -X PUT \
            -H "Authorization: Bot $token" \
            -H 'Content-Type: application/json' \
            --data-binary @bot/commands.json \
            "https://discord.com/api/v10/applications/$app_id/guilds/$guild_id/commands")"
          echo "Discord answered HTTP $code"

          if [ "$code" != "200" ]; then
            head -c 600 "$resp"; echo
            case "$code" in
              401) hint="DISCORD_BOT_TOKEN is invalid or was reset. Reset it in the Developer Portal (Bot > Reset Token) and update the secret." ;;
              403|404) hint="The bot is not in this server, or was invited without the applications.commands scope. Re-invite it with both bot and applications.commands scopes." ;;
              429) hint="Rate limited by Discord. Wait a minute and re-run." ;;
              *) hint="See the response above." ;;
            esac
            echo "::error::Registering commands failed (HTTP $code). $hint"
            exit 1
          fi

          count="$(jq 'length' "$resp")"
          names="$(jq -r '[.[].name] | join(", ")' "$resp")"
          echo "Registered $count commands: $names"
          {
            echo
            echo "### Slash commands"
            echo "Registered **$count** commands in guild \`$guild_id\`: $names"
          } >> "$GITHUB_STEP_SUMMARY"
